# pbwatch configuration
# Location: ~/.config/pbwatch/config.toml
# Apply changes: systemctl --user restart pbwatch

# Bluetooth MAC address(es) of your Pixel Buds.
# Find them with: bluetoothctl devices
macs = ["AB:CD:EF:01:23:45"]

# Name shown at the top of the widget.
# Defaults to the Bluetooth device name when unset.
# device_label = "My Pixel Buds"

# Switch to A2DP (high-quality audio) profile on each connect.
# Requires: pulseaudio-utils, wireplumber
# heal_audio = false

# Colour theme. Overrides the individual colour fields below.
# Available themes: Catppuccin Mocha, Dracula, Everforest Dark, Gruvbox Dark,
#   Kanagawa, Nord, Rosé Pine, SolarizedDark, SynthWave '84, Tokyo Night,
#   Ayu Light, Catppuccin Latte, Everforest Light, GitHub Light, Gruvbox Light,
#   Nord Light, One Light, PaperColor Light, Rosé Pine Dawn, Solarized Light
# theme = "Nord"

# Individual colour fields (hex, with optional alpha: #RRGGBBAA).
# bg_color        = "#1e1e2e"  # background
# text_color      = "#cdd6f4"  # text
# highlight_color = "#89b4fa"  # gauge arc (normal) and active ANC mode
# warn_color      = "#f9e2af"  # gauge arc below battery_warn threshold
# critical_color  = "#f38ba8"  # gauge arc below battery_critical threshold
# ring_color      = "#ffffff20" # gauge track (background arc)

# Background opacity: 0.0 = fully transparent, 1.0 = fully opaque.
# opacity = 0.0

# Battery percentage thresholds for gauge colour changes.
# battery_warn     = 50
# battery_critical = 10

# How long the notification stays on screen, in milliseconds.
# 0 = until dismissed manually.
# auto_close = 5000

# Widget width in pixels.
# image_size = 200

# Font size as a percentage of normal (100 = default, 120 = 20% larger).
# font_size = 100

# Show battery/ANC text alongside the widget image in notifications.
# show_text = false

# Show Adaptive ANC button: "auto" (device-reported), "true", "false".
# anc_adaptive = "auto"

# Force a specific sprite set: "default", "pro", "pro2", "a-series".
# Detected automatically from the device model when unset.
# sprite_set = "pro2"
