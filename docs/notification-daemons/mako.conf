# pbwatch rule for mako
# Add this block to ~/.config/mako/config
# max-icon-size must be >= image_size in ~/.config/pbwatch/config.toml (default 200).

[app-name=pbwatch]
max-icon-size=320
default-timeout=5000
# format=<b>%s</b>

# ── Recommended global settings ──────────────────────────────────────────────
