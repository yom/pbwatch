[workspace]
resolver = "3"
members = ["crates/pbcommon", "crates/pbwatch"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
version = "1.0.0"
license = "MIT"

[workspace.dependencies]
pbcommon = { path = "crates/pbcommon" }

tokio      = { version = "1.40", features = ["rt", "macros", "time", "process", "io-util", "sync"] }
zbus       = { version = "5", default-features = false, features = ["tokio"] }
bluer      = { version = "0.17", default-features = false, features = ["rfcomm"] }
cairo-rs   = { version = "0.20", default-features = false, features = ["png"] }
resvg      = { version = "0.44", default-features = false }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
toml       = "0.8"
clap       = { version = "4.5", features = ["derive", "wrap_help"] }
shlex         = "1"
futures-util  = { version = "0.3", default-features = false, features = ["async-await-macro"] }
anyhow     = "1"
log        = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color"] }
libc       = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
